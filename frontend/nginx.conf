server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API no mesmo domínio do front (sem CORS): /api/* vai para o container da API.
    # Em produção o bundle é gerado com VITE_API_URL vazio e chama /api/... relativo.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA: rotas do React Router (/admin/*, /historico, ...) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
