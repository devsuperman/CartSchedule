# Deploy automático no Lightsail a cada merge na main (ver deploy/README.md).
#   1. testes (ci.yml)
#   2. build das imagens api/web → ghcr.io, com a tag = SHA do commit
#   3. SSH no servidor → deploy/atualizar.sh <sha> (backup, pull, up, health check)
# Rollback: Actions → Deploy → Run workflow, informando a tag (SHA) de uma
# versão anterior; aí testes e build são pulados.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "SHA de uma versão já publicada (rollback). Vazio = testar, buildar e publicar o commit escolhido."
        required: false
        default: ""

# Um deploy por vez; um merge novo espera o anterior terminar (não cancela no meio).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cartschedule

jobs:
  testes:
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/ci.yml

  imagens:
    name: Build e push das imagens
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nome: api
            contexto: backend
          - nome: web
            contexto: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.nome }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.nome }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Só o web usa build-args. VITE_API_URL vazio = chamadas relativas
          # (/api/...) no mesmo domínio; o link do WhatsApp é embutido no bundle.
          build-args: |
            VITE_API_URL=
            VITE_WHATSAPP_GRUPO_URL=${{ vars.WHATSAPP_GRUPO_URL }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

  servidor:
    name: Atualizar servidor
    needs: imagens
    # Roda também no rollback, quando testes/imagens foram pulados (não falharam).
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Tolera CRLF (cópia no Windows) e espaços nas pontas das linhas.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null; then
            echo "::error::LIGHTSAIL_SSH_KEY não é uma chave privada válida (sem senha)." \
              "Cole o conteúdo inteiro de ~/deploy_key, de -----BEGIN até -----END (não o .pub)."
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::LIGHTSAIL_KNOWN_HOSTS vazio. Use a saída de: ssh-keyscan -t ed25519 IP_DO_SERVIDOR"
            exit 1
          fi

      - name: Rodar deploy/atualizar.sh
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USUARIO: ${{ vars.LIGHTSAIL_USER || 'ubuntu' }}
          TAG: ${{ inputs.tag || github.sha }}
          SHA: ${{ github.sha }}
        run: |
          # O código do servidor (compose, Caddyfile, scripts) avança até o
          # commit deste workflow; as imagens usam TAG (= SHA, ou a do rollback).
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$USUARIO@$HOST" \
            "set -e; cd ~/CartSchedule && git fetch -q origin main && git merge -q --ff-only $SHA && bash deploy/atualizar.sh $TAG"
